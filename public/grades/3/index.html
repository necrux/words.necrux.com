    <script>
        const initialTheme = localStorage.getItem("theme");

        if (
            initialTheme === "dark" ||
            (
                initialTheme !== "light" &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
            )
        ) {
            document.documentElement.classList.add("dark");
        }
    </script>

            --body-font: monospace;
            --heading-font: monospace;
            --body-size: 1.1rem;
            --max-width: 900px;
        }

        html.dark {
            --background: #0f172a;
            --foreground: #e2e8f0;
            --accent: #67e8f9;
            --muted: #94a3b8;
            --border: #334155;
