name: Update Spelling Words.

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository.
      uses: actions/checkout@v4
    - name: Set up Python.
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies.
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Updating website artifacts -- HTML, CSS
      env:
        MW_API_KEY: ${{ secrets.MW_API_KEY }}
        QP_API_KEY: ${{ secrets.QP_API_KEY }}
      run: |
        shopt -s extglob
        if ls grades/1/words/test_*([0-9])[0-9].yaml; then
          python ./generate.py --grade 1
        fi

        if ls grades/2/words/test_*([0-9])[0-9].yaml; then
          python ./generate.py --grade 2
        fi

        if ls grades/3/words/test_*([0-9])[0-9].yaml; then
          python ./generate.py --grade 3
        fi

        if ls grades/4/words/test_*([0-9])[0-9].yaml; then
          python ./generate.py --grade 4
        fi

        if ls grades/5/words/test_*([0-9])[0-9].yaml; then
          python ./generate.py --grade 5
        fi
    - name: Commit and Push Artifact(s).
      run: |
        git config --global user.name "generate[bot]"
        git config --global user.email "generate[bot]@users.noreply.github.com"

        git add .

        if ! git diff --cached --quiet; then
          git commit -m "generate: artifact generation [skip ci]"
          git push
        else
          echo "No changes detected in the artifact."
        fi
